name: Build SoundCraft

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip to workspace root
        shell: pwsh
        run: |
          Expand-Archive -Path "soundcraft-main.zip" -DestinationPath ".tmp" -Force
          $src = Join-Path ".tmp" "soundcraft-main"
          if (-not (Test-Path $src)) {$src = (Get-ChildItem -Path ".tmp" -Directory | Select-Object -First 1).FullName
          }
          Copy-Item -Path (Join-Path $src "*") -Destination "." -Recurse -Force

      - name: Remove stray fence lines from edited files
        shell: pwsh
        run: |
          $files = @(
            "crates/engine/src/cmd/view.rs",
            "crates/playback/src/callback.rs",
            "crates/ui-egui/src/app/audio.rs"
          )
          $lines = Get-Content -Path$files[0]
          Set-Content -Path $files[0] -Value ($lines \vert{} Where-Object {$_ -notmatch '^\s*```(\[cite:[^\]]*\])?\s*$' })
          $lines = Get-Content -Path $files[1]
          Set-Content -Path $files[1] -Value ($lines | Where-Object { $_ -notmatch '^\s*```(\[cite:[^\]]*\])?\s*$' })
          $lines = Get-Content -Path$files[2]
          Set-Content -Path $files[2] -Value ($lines \vert{} Where-Object {$_ -notmatch '^\s*```(\[cite:[^\]]*\])?\s*$' })

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build soundcraft.exe
        run: cargo build --release --package soundcraft --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: soundcraft-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/soundcraft.exe
