name: Build SoundCraft

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip to workspace root
        shell: pwsh
        run: |
          Expand-Archive -Path "soundcraft-main.zip" -DestinationPath ".tmp" -Force
          $src = ".tmp/soundcraft-main"
          if (-not (Test-Path $src)) {$src = (Get-Item ".tmp/*")[0].FullName
          }
          Copy-Item -Path "$src/*" -Destination "." -Recurse -Force

      - name: Strip stray markdown fences and cite tags from Rust files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "apps","crates","xtask" -Filter "*.rs" -Recurse -ErrorAction SilentlyContinue
          foreach ($f in$files) {
            $raw = Get-Content -Path$f.FullName -Raw
            $clean = [regex]::Replace($raw, '(?m)^[ \t]*```[^\r\n]*\r?\n?', '')
            $clean = [regex]::Replace($clean, '\[cite:[^\]]*\]', '')
            if ($clean -ne $raw) {
              Set-Content -Path $f.FullName -Value $clean -NoNewline
            }
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build soundcraft.exe
        run: cargo build --release --package soundcraft --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: soundcraft-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/soundcraft.exe
