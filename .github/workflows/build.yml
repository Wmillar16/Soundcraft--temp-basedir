name: Build SoundCraft from Zip

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows soundcraft.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or unpack SoundCraft zip archive
        shell: pwsh
        run: |
          if (-not (Test-Path "Cargo.toml")) {
            $zipFile = Get-ChildItem -Filter "*.zip" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($zipFile) {
              Write-Host "Extracting $($zipFile.FullName)..."
              Expand-Archive -Path $zipFile.FullName -DestinationPath ".unpacked" -Force
            }
          }

          $cargoFile = Get-ChildItem -Filter "Cargo.toml" -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $content = Get-Content $_.FullName -Raw
              $content -match '\[workspace\]'
            } |
            Select-Object -First 1

          if (-not $cargoFile) {
            Write-Error "Workspace Cargo.toml not found in repository or zip archive."
            exit 1
          }

          $projectDir = $cargoFile.Directory.FullName
          Write-Host "Using workspace directory: $projectDir"
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: ${{ env.PROJECT_DIR }}

      - name: Build release executable
        shell: pwsh
        run: |
          Push-Location "${{ env.PROJECT_DIR }}"
          try {
            cargo build --release --package soundcraft --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload soundcraft.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundcraft-windows-x86_64
          path: ${{ env.PROJECT_DIR }}/target/x86_64-pc-windows-msvc/release/soundcraft.exe
